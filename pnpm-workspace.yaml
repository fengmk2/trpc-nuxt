packages:
  - .
  - apps/*
catalogs:
  repo:
    nuxt: 4.4.2
    rolldown: 1.0.0-rc.9
    superjson: ^2.2.6
    zod: ^3.25.76
  trpc:
    '@trpc/client': ^11.12.0
    '@trpc/server': ^11.12.0
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - rolldown
  - sharp
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.1.20-alpha.4
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.20-alpha.4
  vite-plus: 0.1.20-alpha.4
overrides:
  rolldown: 1.0.0-rc.9
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
